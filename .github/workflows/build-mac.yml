name: Build Mac Installer

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: classroom/package-lock.json

      - name: Install dependencies
        working-directory: classroom
        run: npm ci

      - name: Build Mac installer
        working-directory: classroom
        run: npm run build:mac

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: classroom-mac-dmg
          path: classroom/dist/*.dmg
          retention-days: 30
