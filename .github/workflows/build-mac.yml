name: Build Mac Installer

on:
  workflow_dispatch:
    inputs:
      bump_version:
        description: '同时递增版本号'
        type: boolean
        default: false

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: classroom/package-lock.json

      - name: Install dependencies
        working-directory: classroom
        run: npm ci

      - name: Patch dmg-builder to use force detach
        working-directory: classroom
        run: |
          DMG_JS="node_modules/dmg-builder/out/dmg.js"
          if [ -f "$DMG_JS" ]; then
            sed -i '' 's/"detach", "-quiet"/"detach", "-force", "-quiet"/g' "$DMG_JS"
            echo "Patched: $(grep -c 'force' $DMG_JS) occurrence(s)"
          else
            echo "dmg.js not found, skipping patch"
          fi

      - name: Configure git
        if: ${{ inputs.bump_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version & push tag
        if: ${{ inputs.bump_version }}
        run: |
          cd classroom
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          cd ..
          git add classroom/package.json classroom/package-lock.json
          git commit -m "chore: bump to v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin HEAD:main --tags

      - name: Build Mac installer
        working-directory: classroom
        run: npm run build:mac

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: classroom-mac-dmg
          path: classroom/dist/*.dmg
          retention-days: 30
