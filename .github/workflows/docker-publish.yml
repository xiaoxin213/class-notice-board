name: Build & Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:    # 支持手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/class-notice-board

jobs:
  # ── Job 1：自动升版本 + 编译教室端 Electron 安装包 ──────────────────────────
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write      # 允许 CI 推版本号 commit + tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: classroom/package-lock.json

      - name: Install dependencies
        working-directory: classroom
        run: npm ci

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version & push tag
        shell: bash
        run: |
          cd classroom
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          cd ..
          git add classroom/package.json classroom/package-lock.json
          git commit -m "chore: bump to v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin HEAD:main --tags

      - name: Build Windows installer
        working-directory: classroom
        run: npm run build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: classroom-installer
          path: classroom/dist/*.exe
          retention-days: 7

  # ── Job 2：构建 Docker 镜像并推送到 GHCR ────────────────────────────────────
  build-push:
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送到 GHCR 必须

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download classroom installer
        uses: actions/download-artifact@v4
        with:
          name: classroom-installer
          path: web/public/downloads   # Vite 构建时会把 public/ 原样复制进 dist/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max