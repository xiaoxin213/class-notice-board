name: Build Linux x64

on:
  workflow_dispatch:
jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: classroom/package-lock.json

      - name: Install dependencies
        working-directory: classroom
        run: npm ci

      - name: Build AppImage (x64)
        working-directory: classroom
        run: npm run build:linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-appimage
          path: classroom/dist/*.AppImage
          retention-days: 30
