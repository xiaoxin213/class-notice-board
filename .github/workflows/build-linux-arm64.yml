name: Build Linux arm64

on:
  workflow_dispatch:
jobs:
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: classroom/package-lock.json

      - name: Install dependencies
        working-directory: classroom
        run: npm ci

      - name: Build AppImage (arm64)
        working-directory: classroom
        # ws 无原生绑定，electron-builder 可从 x64 runner 直接交叉编译 arm64
        run: npm run build:linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-appimage
          path: classroom/dist/*.AppImage
          retention-days: 30
