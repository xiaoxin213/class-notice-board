<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>班级通知屏 · 设置</title>
<style>
  :root { --yellow:#f59e0b; --green:#22c55e; --red:#ef4444; --gray:#6b7280; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,'Microsoft YaHei',sans-serif; background:#fafaf9; color:#1c1917; font-size:14px; }
  h1 { font-size:18px; font-weight:700; color:#1c1917; }
  .header { background:linear-gradient(135deg,#fef3c7,#fde68a); padding:20px 24px; border-bottom:1px solid #fde68a; }
  .subtitle { font-size:12px; color:#92400e; margin-top:4px; }
  .body { padding:20px 24px; display:flex; flex-direction:column; gap:16px; }
  .card { background:#fff; border:1px solid #e7e5e4; border-radius:10px; padding:16px; }
  .card-title { font-size:13px; font-weight:600; color:#57534e; margin-bottom:12px; text-transform:uppercase; letter-spacing:.5px; }
  .status-row { display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot-on { background:var(--green); box-shadow:0 0 0 3px #bbf7d0; }
  .dot-off { background:var(--gray); }
  .status-text { font-size:13px; color:#44403c; }
  .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .form-group:last-child { margin-bottom:0; }
  label { font-size:12px; font-weight:500; color:#57534e; }
  input[type=text], input[type=url] {
    border:1px solid #d6d3d1; border-radius:6px; padding:8px 10px;
    font-size:13px; width:100%; outline:none; background:#fff;
  }
  input:focus { border-color:var(--yellow); box-shadow:0 0 0 2px #fde68a55; }
  .radio-group { display:flex; gap:8px; }
  .radio-btn {
    flex:1; padding:8px; border:1px solid #d6d3d1; border-radius:6px;
    text-align:center; cursor:pointer; font-size:12px; background:#fff; color:#57534e;
    transition:all .15s;
  }
  .radio-btn.active { background:#fef3c7; border-color:var(--yellow); color:#92400e; font-weight:600; }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; }
  .toggle { position:relative; width:44px; height:24px; cursor:pointer; }
  .toggle input { opacity:0; width:0; height:0; }
  .slider {
    position:absolute; inset:0; background:#d6d3d1; border-radius:12px; transition:.2s;
  }
  .slider:before {
    content:''; position:absolute; width:18px; height:18px; left:3px; top:3px;
    background:#fff; border-radius:50%; transition:.2s;
  }
  input:checked + .slider { background:var(--yellow); }
  input:checked + .slider:before { transform:translateX(20px); }
  .btn { padding:9px 16px; border-radius:7px; border:none; font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; }
  .btn-primary { background:var(--yellow); color:#fff; width:100%; }
  .btn-primary:hover { background:#d97706; }
  .btn-primary:disabled { background:#d6d3d1; cursor:not-allowed; }
  .msg { font-size:12px; margin-top:8px; text-align:center; min-height:16px; }
  .msg.ok  { color:var(--green); }
  .msg.err { color:var(--red); }
  #tabs { display:flex; gap:2px; border-bottom:1px solid #e7e5e4; padding:0 24px; background:#fff; }
  .tab { padding:12px 16px; font-size:13px; font-weight:500; color:var(--gray); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active { color:#92400e; border-bottom-color:var(--yellow); }
  .pane { display:none; }
  .pane.active { display:flex; flex-direction:column; gap:16px; }
</style>
</head>
<body>
<div class="header">
  <h1>&#x1F4E2; 班级通知屏</h1>
  <p class="subtitle">教室端客户端 · 设置</p>
</div>
<div id="tabs">
  <div class="tab active" onclick="switchTab('bind')">绑定 / 状态</div>
  <div class="tab" onclick="switchTab('settings')">显示设置</div>
</div>
<div class="body">

  <div id="pane-bind" class="pane active">
    <div class="card">
      <div class="card-title">连接状态</div>
      <div class="status-row">
        <div class="dot dot-off" id="dot"></div>
        <span class="status-text" id="status-text">未连接</span>
      </div>
      <div style="margin-top:6px;font-size:12px;color:#78716c" id="class-info"></div>
    </div>

    <div class="card">
      <div class="card-title">首次绑定</div>
      <div class="form-group">
        <label>服务器地址</label>
        <input type="url" id="serverUrl" placeholder="http://192.168.1.100:3210">
      </div>
      <div class="form-group">
        <label>绑定码（6位数字）</label>
        <input type="text" id="bindCode" placeholder="123456" maxlength="6" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>本机名称（可选）</label>
        <input type="text" id="deviceName" placeholder="教室电脑" maxlength="40">
      </div>
      <button class="btn btn-primary" id="bindBtn" onclick="doBind()">绑定此教室电脑</button>
      <div class="msg" id="bind-msg"></div>
    </div>
  </div>

  <div id="pane-settings" class="pane">
    <div class="card">
      <div class="card-title">通知展示方式</div>
      <div class="radio-group">
        <div class="radio-btn" id="mode-fullscreen" onclick="setMode('fullscreen')">
          &#x1F5A5; 全屏覆盖
        </div>
        <div class="radio-btn" id="mode-toast" onclick="setMode('toast')">
          &#x1F514; 右下角浮窗
        </div>
      </div>
      <div style="margin-top:8px;font-size:11px;color:#78716c">
        全屏：最醒目，适合课间；浮窗：不影响投影/上课
      </div>
    </div>

    <div class="card">
      <div class="card-title">系统</div>
      <div class="toggle-row">
        <span style="font-size:13px">开机自动启动</span>
        <label class="toggle">
          <input type="checkbox" id="autoStart" onchange="setAutoStart(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>
</div>

<script>
let cfg = {};

async function init() {
  cfg = await window.cnb.config.get();
  document.getElementById('serverUrl').value  = cfg.serverUrl  || '';
  document.getElementById('deviceName').value = cfg.deviceName || '教室电脑';
  document.getElementById('autoStart').checked = !!cfg.autoStart;
  setModeUI(cfg.displayMode || 'fullscreen');
  updateStatus({ connected: false });
  const st = await window.cnb.ws.status();
  updateStatus(st);
}

function updateStatus(st) {
  const dot  = document.getElementById('dot');
  const txt  = document.getElementById('status-text');
  const info = document.getElementById('class-info');
  if (st.connected) {
    dot.className = 'dot dot-on';
    txt.textContent = '已连接';
    info.textContent = '班级：' + (st.className || '—') + '  设备ID：' + (st.deviceId || '—');
  } else {
    dot.className = 'dot dot-off';
    txt.textContent = '未连接（重连中…）';
    info.textContent = cfg.serverUrl ? '服务器：' + cfg.serverUrl : '';
  }
}

window.cnb.on('ws:status', updateStatus);

function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['bind','settings'][i]===id));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-'+id).classList.add('active');
}

async function doBind() {
  const serverUrl  = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
  const bindCode   = document.getElementById('bindCode').value.trim();
  const deviceName = document.getElementById('deviceName').value.trim() || '教室电脑';
  const msg        = document.getElementById('bind-msg');
  const btn        = document.getElementById('bindBtn');
  if (!serverUrl || !bindCode) { msg.className='msg err'; msg.textContent='请填写服务器地址和绑定码'; return; }
  btn.disabled = true; msg.className='msg'; msg.textContent='绑定中…';
  try {
    const res = await window.cnb.device.bind({ serverUrl, bindCode, deviceName });
    msg.className='msg ok';
    msg.textContent = '绑定成功！班级：' + res.className;
    cfg.serverUrl  = serverUrl;
    cfg.deviceName = deviceName;
  } catch(e) {
    msg.className='msg err'; msg.textContent = e.message;
  } finally { btn.disabled = false; }
}

function setModeUI(mode) {
  document.getElementById('mode-fullscreen').classList.toggle('active', mode==='fullscreen');
  document.getElementById('mode-toast').classList.toggle('active', mode==='toast');
}

async function setMode(mode) {
  cfg.displayMode = mode;
  setModeUI(mode);
  await window.cnb.config.save({ displayMode: mode });
}

async function setAutoStart(val) {
  await window.cnb.config.save({ autoStart: val });
}

init();
</script>
</body>
</html>
