<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>通知</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:400px; height:140px; overflow:hidden; background:transparent; }
  body { font-family:system-ui,'Microsoft YaHei',sans-serif; -webkit-app-region:no-drag; }
  .card {
    margin:8px; border-radius:12px; padding:14px 16px;
    background:rgba(20,20,20,.92);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 8px 32px rgba(0,0,0,.4);
    animation:slideIn .25s cubic-bezier(.34,1.56,.64,1);
    color:#fff; height:calc(100% - 16px); display:flex; flex-direction:column; justify-content:space-between;
    position:relative;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .top { display:flex; align-items:flex-start; gap:10px; padding-right:22px; }
  .bell { font-size:22px; flex-shrink:0; margin-top:1px; }
  .texts { flex:1; min-width:0; }
  .title { font-size:14px; font-weight:600; line-height:1.3; word-break:break-all; }
  .publisher { font-size:11px; color:rgba(255,255,255,.5); margin-top:3px; }
  .progress-track { background:rgba(255,255,255,.15); border-radius:3px; height:3px; overflow:hidden; }
  .progress-bar { height:100%; background:#fbbf24; border-radius:3px; width:100%; transition:width linear; }
  .close-btn {
    position:absolute; top:8px; right:10px;
    background:none; border:none;
    color:rgba(255,255,255,.45);
    font-size:14px; width:20px; height:20px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    border-radius:4px; transition:color .15s, background .15s;
    line-height:1; padding:0;
  }
  .close-btn:hover { color:#fff; background:rgba(255,255,255,.15); }
</style>
</head>
<body>
<div class="card" id="card">
  <button class="close-btn" id="closeBtn" title="关闭">&#x2715;</button>
  <div class="top">
    <div class="bell">&#x1F4E2;</div>
    <div class="texts">
      <div class="title" id="content"></div>
      <div class="publisher" id="publisher"></div>
    </div>
  </div>
  <div class="progress-track"><div class="progress-bar" id="bar"></div></div>
</div>
<script>
let timer = null;
let currentId = null;

/* ── TTS 检测（方案 A）──
   首次调用时检测是否有中文语音，结果缓存，避免重复检测。
   Linux / 麒麟等系统可能没有 speech-dispatcher 或中文语音包，
   此时 getVoices() 始终为空，3 秒后超时视为不可用，静默跳过播报。
*/
let _ttsAvailable = null;
function checkTTS(cb) {
  if (_ttsAvailable !== null) { cb(_ttsAvailable); return; }
  if (!window.speechSynthesis) { _ttsAvailable = false; cb(false); return; }
  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    _ttsAvailable = voices.some(v => v.lang.startsWith('zh'));
    cb(_ttsAvailable);
    return;
  }
  const timeout = setTimeout(() => {
    window.speechSynthesis.onvoiceschanged = null;
    _ttsAvailable = false;
    cb(false);
  }, 3000);
  window.speechSynthesis.onvoiceschanged = () => {
    clearTimeout(timeout);
    window.speechSynthesis.onvoiceschanged = null;
    _ttsAvailable = window.speechSynthesis.getVoices().some(v => v.lang.startsWith('zh'));
    cb(_ttsAvailable);
  };
}
// 页面加载时预热检测，缩短首次通知的延迟
checkTTS(() => {});

function dismiss() {
  clearTimeout(timer);
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (currentId !== null) {
    window.cnb.notifyDone(currentId);
    currentId = null;
  }
}

document.getElementById('closeBtn').addEventListener('click', dismiss);

window.cnb.on('notify:show', (notice) => {
  clearTimeout(timer);
  if (window.speechSynthesis) window.speechSynthesis.cancel();

  currentId = notice.id;

  document.getElementById('content').textContent   = notice.content;
  document.getElementById('publisher').textContent = notice.publisher ? '— ' + notice.publisher : '';

  const sec = notice.displaySeconds || 60;
  const bar = document.getElementById('bar');
  bar.style.transition = 'none'; bar.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = 'width ' + sec + 's linear';
    bar.style.width = '0%';
  }));

  let remaining = notice.speakTimes || 1;
  function speak() {
    if (remaining <= 0) return;
    remaining--;
    const utt = new SpeechSynthesisUtterance(notice.content);
    utt.lang = 'zh-CN'; utt.rate = 0.95;
    const voices = window.speechSynthesis.getVoices();
    const zh = voices.find(v => v.lang.startsWith('zh'));
    if (zh) utt.voice = zh;
    utt.onend = () => { if (remaining > 0) setTimeout(speak, 800); };
    window.speechSynthesis.speak(utt);
  }

  checkTTS((available) => {
    if (available) speak();
    // 不可用时静默跳过，toast 卡片本身已经可见，无需额外提示
  });

  timer = setTimeout(() => {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    window.cnb.notifyDone(notice.id);
    currentId = null;
  }, sec * 1000);
});
</script>
</body>
</html>
