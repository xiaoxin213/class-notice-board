<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>通知</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:400px; height:140px; overflow:hidden; background:transparent; }
  body { font-family:system-ui,'Microsoft YaHei',sans-serif; -webkit-app-region:no-drag; }
  .card {
    margin:8px; border-radius:12px; padding:14px 16px;
    background:rgba(20,20,20,.92);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 8px 32px rgba(0,0,0,.4);
    animation:slideIn .25s cubic-bezier(.34,1.56,.64,1);
    color:#fff; height:calc(100% - 16px); display:flex; flex-direction:column; justify-content:space-between;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .top { display:flex; align-items:flex-start; gap:10px; }
  .bell { font-size:22px; flex-shrink:0; margin-top:1px; }
  .texts { flex:1; min-width:0; }
  .title { font-size:14px; font-weight:600; line-height:1.3; word-break:break-all; }
  .publisher { font-size:11px; color:rgba(255,255,255,.5); margin-top:3px; }
  .progress-track { background:rgba(255,255,255,.15); border-radius:3px; height:3px; overflow:hidden; }
  .progress-bar { height:100%; background:#fbbf24; border-radius:3px; width:100%; transition:width linear; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top">
    <div class="bell">&#x1F4E2;</div>
    <div class="texts">
      <div class="title" id="content"></div>
      <div class="publisher" id="publisher"></div>
    </div>
  </div>
  <div class="progress-track"><div class="progress-bar" id="bar"></div></div>
</div>
<script>
let timer = null;

window.cnb.on('notify:show', (notice) => {
  clearTimeout(timer);
  window.speechSynthesis.cancel();

  document.getElementById('content').textContent   = notice.content;
  document.getElementById('publisher').textContent = notice.publisher ? '— ' + notice.publisher : '';

  const sec = notice.displaySeconds || 60;
  const bar = document.getElementById('bar');
  bar.style.transition = 'none'; bar.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = 'width ' + sec + 's linear';
    bar.style.width = '0%';
  }));

  let remaining = notice.speakTimes || 1;
  function speak() {
    if (remaining <= 0) return;
    remaining--;
    const utt = new SpeechSynthesisUtterance(notice.content);
    utt.lang = 'zh-CN'; utt.rate = 0.95;
    const voices = window.speechSynthesis.getVoices();
    const zh = voices.find(v => v.lang.startsWith('zh'));
    if (zh) utt.voice = zh;
    utt.onend = () => { if (remaining > 0) setTimeout(speak, 800); };
    window.speechSynthesis.speak(utt);
  }
  if (window.speechSynthesis.getVoices().length > 0) speak();
  else { window.speechSynthesis.onvoiceschanged = () => { speak(); window.speechSynthesis.onvoiceschanged = null; }; }

  timer = setTimeout(() => {
    window.speechSynthesis.cancel();
    window.cnb.notifyDone(notice.id);
  }, sec * 1000);
});
</script>
</body>
</html>
